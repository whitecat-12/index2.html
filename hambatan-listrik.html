<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AR Praktikum Elektronika — Paralel + Resistor</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden; background: #0b0f14;
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
/* MindAR mengatur sendiri posisi video & canvas di dalam container */
#container { position: fixed; inset: 0; display: none; background: #000; overflow: hidden; }
#container.mode-3d canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }

#overlay {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 22px; padding: 32px; text-align: center; color: #e7f6f8;
  background: radial-gradient(circle at 50% 30%, #10241f 0%, #0b0f14 70%);
}
#overlay h1 {
  font-size: 40px; font-weight: 700; line-height: 1.2;
  background: linear-gradient(135deg, #34d399, #22d3ee, #a78bfa);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#overlay p.sub { font-size: 14px; color: #7f9aa3; max-width: 380px; line-height: 1.6; }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
#startBtn, #demoBtn {
  padding: 14px 32px; font-size: 16px; font-weight: 600; border: none;
  border-radius: 999px; cursor: pointer; transition: transform .15s, box-shadow .2s;
}
#startBtn { background: linear-gradient(135deg, #34d399, #0891b2); color: #04211c; }
#startBtn:hover { box-shadow: 0 0 32px 4px rgba(52,211,153,.35); }
#demoBtn { background: rgba(255,255,255,.08); color: #d6faff; border: 1px solid rgba(255,255,255,.2); }
#demoBtn:hover { background: rgba(255,255,255,.15); }
.btn-row button:active { transform: scale(.96); }
.btn-row button:disabled { opacity: .5; }
#statusMsg {
  font-size: 12.5px; color: #8fa5ab; min-height: 34px; line-height: 1.5;
  position: absolute; bottom: 24px; left: 0; right: 0; padding: 0 24px; pointer-events: none;
}
#statusMsg.error { color: #ff9a8a; }

#hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: none;
  align-items: center; justify-content: space-between; padding: 14px 18px;
  background: linear-gradient(180deg, rgba(0,0,0,.65), transparent); pointer-events: none;
}
#hud .left { display: flex; align-items: center; gap: 10px; }
#hud span { color: #fff; font-size: 13px; opacity: .9; text-shadow: 0 1px 8px rgba(0,0,0,.7); }
#modeBadge {
  font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px;
  background: rgba(52,211,153,.2); border: 1px solid rgba(52,211,153,.5); color: #a7f3d0;
}
#modeBadge.mode-3d { background: rgba(167,139,250,.2); border-color: rgba(167,139,250,.55); color: #ddd6fe; }
#stopBtn {
  pointer-events: auto; padding: 8px 18px; font-size: 13px; font-weight: 600;
  background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.25);
  border-radius: 999px; cursor: pointer; backdrop-filter: blur(6px);
}

#panel {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: none;
  flex-direction: column; gap: 8px; padding: 14px 16px 18px;
  background: linear-gradient(0deg, rgba(3,10,14,.92) 30%, rgba(3,10,14,0));
  pointer-events: none;
}
#panel .row { display: flex; gap: 10px; pointer-events: auto; }
.sw {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 8px; font-size: 13px; font-weight: 700;
  background: rgba(255,255,255,.07); color: #93a7ad;
  border: 1px solid rgba(255,255,255,.14); border-radius: 14px;
  cursor: pointer; backdrop-filter: blur(8px); transition: all .2s;
}
.sw .dot { width: 9px; height: 9px; border-radius: 50%; background: #46555a; transition: all .2s; }
.sw.on { background: rgba(52,211,153,.16); border-color: rgba(52,211,153,.55); color: #d6fff2; }
.sw.on .dot { background: #34d399; box-shadow: 0 0 10px 2px rgba(52,211,153,.75); }
.sw.main.on { background: rgba(250,204,21,.16); border-color: rgba(250,204,21,.55); color: #fff7d6; }
.sw.main.on .dot { background: #facc15; box-shadow: 0 0 10px 2px rgba(250,204,21,.75); }
.sw:active { transform: scale(.97); }
#info { text-align: center; font-size: 11.5px; line-height: 1.5; color: #7fd8c4; padding: 2px 6px 0; min-height: 16px; }

/* Panel pengaturan resistor */
#panelToggle {
  pointer-events: auto; align-self: flex-start; padding: 7px 14px; font-size: 12.5px; font-weight: 700;
  background: rgba(255,255,255,.1); color: #e7f6f8; border: 1px solid rgba(255,255,255,.22);
  border-radius: 999px; cursor: pointer; backdrop-filter: blur(6px);
}
#ctrl {
  pointer-events: auto; max-height: 34vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: rgba(3,10,14,.82); border: 1px solid rgba(255,255,255,.1);
  border-radius: 14px; padding: 10px; backdrop-filter: blur(8px);
}
.card {
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  border-radius: 12px; padding: 9px 10px; margin-bottom: 8px; color: #d6e8ec; font-size: 12.5px;
}
.card:last-child { margin-bottom: 0; }
.chead { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 8px; }
.add {
  padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
  background: rgba(52,211,153,.18); color: #b9f8e1; border: 1px solid rgba(52,211,153,.5); border-radius: 999px;
}
.add:disabled { opacity: .4; cursor: default; }
.del {
  width: 30px; height: 30px; font-size: 13px; cursor: pointer; flex: none;
  background: rgba(255,120,100,.14); color: #ffb4a8; border: 1px solid rgba(255,120,100,.4); border-radius: 8px;
}
.rrow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.rrow .nm { width: 28px; font-weight: 700; color: #a5b4fc; }
.rrow .unit { color: #9fb6bc; }
input[type=number] {
  width: 110px; padding: 6px 8px; font-size: 16px; color: #e7f6f8;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.22); border-radius: 8px;
}
input[type=number]:focus { outline: none; border-color: #34d399; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: #9fb6bc; }
.grid2 .in { display: flex; align-items: center; gap: 6px; color: #d6e8ec; font-size: 13px; }
.grid2 input[type=number] { width: 90px; }
.csum { font-size: 11.5px; line-height: 1.5; color: #7fd8c4; white-space: pre-line; margin-top: 4px; }

@media (max-width: 480px) {
  #overlay h1 { font-size: 28px; }
  #startBtn, #demoBtn { padding: 12px 24px; font-size: 15px; }
  .sw { font-size: 12px; padding: 10px 6px; }
}
</style>
</head>
<body>

<div id="overlay">
  <h1>AR Praktikum Elektronika</h1>
  <p class="sub">Rangkaian Paralel + Resistor — tambah resistor, ubah nilainya, lalu amati bagaimana arus dan kecerahan lampu berubah.</p>
  <div class="btn-row">
    <button id="startBtn">Mulai AR</button>
    <button id="demoBtn">Mode 3D</button>
  </div>
  <p id="statusMsg"></p>
</div>

<div id="hud">
  <div class="left">
    <span id="modeBadge">AR</span>
    <span id="hudText">Arahkan kamera ke gambar target…</span>
  </div>
  <button id="stopBtn">Stop</button>
</div>

<div id="panel">
  <button id="panelToggle">▾ Atur rangkaian</button>
  <div id="ctrl">
    <div class="card">
      <div class="grid2">
        <label>Tegangan baterai
          <span class="in"><input id="vIn" type="number" inputmode="decimal" step="any" min="1" max="24" /> V</span>
        </label>
        <label>Hambatan tiap lampu
          <span class="in"><input id="rlIn" type="number" inputmode="decimal" step="any" min="1" max="10000" /> Ω</span>
        </label>
      </div>
    </div>
    <div id="branches"></div>
  </div>
  <div class="row">
    <button class="sw main" id="btnMain"><span class="dot"></span>Utama</button>
    <button class="sw" id="btnS1"><span class="dot"></span>S1</button>
    <button class="sw" id="btnS2"><span class="dot"></span>S2</button>
  </div>
  <div id="info"></div>
</div>

<datalist id="rvals">
  <option value="1"></option><option value="10"></option><option value="22"></option>
  <option value="47"></option><option value="100"></option><option value="220"></option>
  <option value="330"></option><option value="470"></option><option value="1000"></option>
  <option value="2200"></option><option value="4700"></option><option value="10000"></option>
</datalist>

<div id="container"></div>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ───────── KONFIGURASI ─────────
const IMAGE_TARGET_SRC = 'targets/bumi.mind';
const AR_SCALE = 0.6;   // ukuran rangkaian relatif terhadap gambar target (lebar target = 1)

const RAIL_L = -0.62, Y_BOT = -0.42;
let RAIL_R = 0.62;      // dihitung ulang mengikuti jumlah resistor
const BAT_X0 = -0.38, BAT_X1 = -0.08, MAIN_SW_X = 0.30;
const SW_GAP = 0.11, LAMP_GAP = 0.10, WIRE_R = 0.016;
const BRANCH_DEF = [
  { id: 's1', y: 0.50, lampX: -0.28 },
  { id: 's2', y: 0.08, lampX: -0.28 },
];

// Resistor
const RES_HALF = 0.065;   // setengah panjang resistor (ujung kaki)
const RES_PITCH = 0.16;   // jarak antar resistor
const RES_MAX = 6;        // maksimum resistor per cabang
const RMIN = 1, RMAX = 1e6;
const LAMP_RATED_V = 6;   // lampu menyala penuh pada 6 V

// Data yang bisa diubah pengguna
const model = {
  V: 6,
  Rlamp: 20,
  branches: { s1: [10], s2: [10, 10] }, // nilai resistor (Ω), terpasang seri dengan lampu di tiap cabang
};

// ───────── DOM ─────────
const $ = (id) => document.getElementById(id);
const startBtn = $('startBtn'), demoBtn = $('demoBtn'), stopBtn = $('stopBtn');
const overlay = $('overlay'), hud = $('hud'), hudText = $('hudText'), modeBadge = $('modeBadge');
const panel = $('panel'), container = $('container'), statusMsg = $('statusMsg'), infoEl = $('info');

// ───────── STATE ─────────
const state = { main: false, s1: false, s2: false };
let mindarThree = null, mode3D = null, currentMode = null, circuit = null, circuitCtx = null;
let arRenderer = null, arScene = null, arCamera = null;
const clock = new THREE.Clock();

// ───────── HELPER ─────────
const wireMat = new THREE.MeshStandardMaterial({ color: 0xd9a441, metalness: 0.92, roughness: 0.28 });
wireMat.userData.shared = true;

function makeWire(x1, y1, x2, y2, r = WIRE_R) {
  const a = new THREE.Vector3(x1, y1, 0), b = new THREE.Vector3(x2, y2, 0);
  if (a.distanceTo(b) < 1e-4) return new THREE.Group();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, a.distanceTo(b), 14), wireMat);
  mesh.position.copy(a).lerp(b, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  return mesh;
}

// Bola kecil penutup sambungan/sudut kabel supaya tidak ada celah
const jointGeo = new THREE.SphereGeometry(WIRE_R * 1.35, 14, 14);
jointGeo.userData.shared = true;
function addJoint(parent, x, y) {
  const m = new THREE.Mesh(jointGeo, wireMat);
  m.position.set(x, y, 0);
  parent.add(m);
}

function makeLabel(text, color = '#8ef7ff') {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 68px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 14;
  ctx.fillText(text, 256, 68);
  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 4;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false,
  }));
  sprite.scale.set(0.30, 0.075, 1);
  return sprite;
}

// Label resistor: nama (R1, R2, …) + nilai, bisa diperbarui tanpa membangun ulang
function makeResLabel() {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 4;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false,
  }));
  sprite.scale.set(0.17, 0.085, 1);
  sprite.userData.set = (name, text) => {
    ctx.clearRect(0, 0, 256, 128);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 10;
    ctx.font = 'bold 36px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillStyle = '#a5b4fc'; ctx.fillText(name, 128, 32);
    ctx.font = 'bold 54px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillStyle = '#ffe28a'; ctx.fillText(text, 128, 90);
    tex.needsUpdate = true;
  };
  return sprite;
}

// Tekstur cahaya lembut (radial) untuk halo lampu
function makeGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const gr = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0.00, 'rgba(255,240,180,1)');
  gr.addColorStop(0.22, 'rgba(255,196,90,0.60)');
  gr.addColorStop(0.55, 'rgba(255,150,40,0.16)');
  gr.addColorStop(1.00, 'rgba(255,140,30,0)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowTexture();
glowTex.userData.shared = true;

// Elektron (dipakai bersama semua cabang)
const electronGeo = new THREE.SphereGeometry(0.018, 10, 10);
const electronMat = new THREE.MeshBasicMaterial({ color: 0x6ff2ff });
electronGeo.userData.shared = true; electronMat.userData.shared = true;

// Format angka
function trim(n, d) { return String(parseFloat(n.toFixed(d))); }
function fmtR(v) {
  if (v >= 1e6) return trim(v / 1e6, 2) + ' MΩ';
  if (v >= 1000) return trim(v / 1000, 2) + ' kΩ';
  return trim(v, 2) + ' Ω';
}
function fmtI(a) {
  if (a >= 1) return a.toFixed(2) + ' A';
  if (a >= 0.001) return (a * 1000).toFixed(1) + ' mA';
  if (a > 0) return (a * 1e6).toFixed(0) + ' µA';
  return '0 mA';
}

// Kode warna resistor (4 gelang)
const DIGIT_COLORS = [0x111111, 0x7b3f00, 0xe53935, 0xfb8c00, 0xfdd835, 0x43a047, 0x1e88e5, 0x8e24aa, 0x9e9e9e, 0xffffff];
function colorBands(v) {
  v = Math.max(RMIN, v);
  let exp = Math.floor(Math.log10(v));
  let sig = Math.round(v / Math.pow(10, exp - 1));
  if (sig >= 100) { sig = 10; exp += 1; }
  return [Math.floor(sig / 10), sig % 10, exp - 1]; // digit1, digit2, pangkat pengali
}

// ───────── LAMPU ─────────
// Terminal kiri/kanan (di x = ±LAMP_GAP) dihubungkan langsung ke dudukan lampu,
// sehingga kabel dari rel/baterai benar-benar tersambung ke lampu.
function createLamp(labelText) {
  const g = new THREE.Group();

  // Terminal + kabel penghubung ke dudukan
  const postMat = new THREE.MeshStandardMaterial({ color: 0xffc107, metalness: 0.9, roughness: 0.25 });
  const postGeo = new THREE.CylinderGeometry(0.023, 0.023, 0.05, 14);
  const p1 = new THREE.Mesh(postGeo, postMat); p1.position.set(-LAMP_GAP, 0.02, 0);
  const p2 = new THREE.Mesh(postGeo, postMat); p2.position.set(LAMP_GAP, 0.02, 0);
  g.add(p1, p2);
  g.add(makeWire(-LAMP_GAP, 0, -0.045, 0));
  g.add(makeWire(0.045, 0, LAMP_GAP, 0));

  // Badan lampu (sedikit diperkecil)
  const body = new THREE.Group();
  body.scale.setScalar(0.9);
  g.add(body);

  // Dudukan ulir (screw base)
  const metal = new THREE.MeshStandardMaterial({ color: 0xc4ccd2, metalness: 0.95, roughness: 0.3 });
  const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.046, 0.046, 0.07, 28), metal);
  sleeve.position.y = 0.005; body.add(sleeve);
  const ringGeo = new THREE.TorusGeometry(0.047, 0.005, 8, 28);
  [-0.015, 0.0, 0.015, 0.03].forEach((y) => {
    const ring = new THREE.Mesh(ringGeo, metal);
    ring.rotation.x = Math.PI / 2; ring.position.y = y; body.add(ring);
  });
  const collar = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.05, 0.012, 28),
    new THREE.MeshStandardMaterial({ color: 0x2b2f33, roughness: 0.6, metalness: 0.3 })
  );
  collar.position.y = 0.046; body.add(collar);
  const insul = new THREE.Mesh(
    new THREE.CylinderGeometry(0.038, 0.038, 0.01, 20),
    new THREE.MeshStandardMaterial({ color: 0x1a1d20, roughness: 0.7 })
  );
  insul.position.y = -0.033; body.add(insul);
  const contact = new THREE.Mesh(
    new THREE.CylinderGeometry(0.018, 0.018, 0.01, 16),
    new THREE.MeshStandardMaterial({ color: 0xd9a441, metalness: 0.95, roughness: 0.25 })
  );
  contact.position.y = -0.041; body.add(contact);

  // Bohlam kaca (profil klasik, dibuat dengan Lathe)
  const prof = new THREE.SplineCurve([
    new THREE.Vector2(0.034, 0.052), new THREE.Vector2(0.036, 0.070),
    new THREE.Vector2(0.046, 0.092), new THREE.Vector2(0.063, 0.112),
    new THREE.Vector2(0.078, 0.132), new THREE.Vector2(0.084, 0.155),
    new THREE.Vector2(0.080, 0.178), new THREE.Vector2(0.068, 0.200),
    new THREE.Vector2(0.048, 0.220), new THREE.Vector2(0.024, 0.233),
    new THREE.Vector2(0.000, 0.237),
  ]).getPoints(48);
  const bulbMat = new THREE.MeshStandardMaterial({
    color: 0xe6f4ff, emissive: 0xffb347, emissiveIntensity: 0,
    transparent: true, opacity: 0.28, roughness: 0.04, metalness: 0.05,
    side: THREE.DoubleSide, depthWrite: false,
  });
  const bulb = new THREE.Mesh(new THREE.LatheGeometry(prof, 36), bulbMat);
  body.add(bulb);

  // Tiang kaca + penyangga filamen
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.008, 0.011, 0.055, 12),
    new THREE.MeshStandardMaterial({ color: 0xcfe3ee, transparent: true, opacity: 0.55, roughness: 0.2 })
  );
  stem.position.y = 0.0775; body.add(stem);
  body.add(makeWire(-0.005, 0.098, -0.022, 0.150, 0.0035));
  body.add(makeWire(0.005, 0.098, 0.022, 0.150, 0.0035));

  // Filamen berbentuk koil
  const pts = [];
  const N = 90, turns = 7;
  for (let i = 0; i <= N; i++) {
    const t = i / N, a = t * Math.PI * 2 * turns;
    pts.push(new THREE.Vector3(-0.022 + 0.044 * t, 0.150 + 0.008 * Math.sin(a), 0.008 * Math.cos(a)));
  }
  const filOff = new THREE.Color(0x6a5a48), filOn = new THREE.Color(0xfff2b8);
  const filMat = new THREE.MeshStandardMaterial({
    color: filOff.clone(), emissive: 0xff9a1a, emissiveIntensity: 0, metalness: 0.6, roughness: 0.4,
  });
  const filament = new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 160, 0.0035, 6, false), filMat
  );
  body.add(filament);

  // Inti cahaya (menyala di dalam bohlam)
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.05, 20, 20),
    new THREE.MeshBasicMaterial({
      color: 0xffe08a, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false,
    })
  );
  core.position.y = 0.150; body.add(core);

  // Halo cahaya
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  halo.position.y = 0.150; halo.scale.set(0.45, 0.45, 1); body.add(halo);

  const light = new THREE.PointLight(0xffcc55, 0, 1.8, 1.4);
  light.position.y = 0.150; body.add(light);

  const lbl = makeLabel(labelText, '#9ef7ff');
  lbl.position.set(0, -0.17, 0); body.add(lbl);

  g.userData = { bulbMat, filMat, filOff, filOn, core, halo, light };
  return g;
}

function createSwitch(labelText, swId) {
  const g = new THREE.Group();
  const postMat = new THREE.MeshStandardMaterial({ color: 0xffc107, metalness: 0.9, roughness: 0.25 });
  const postGeo = new THREE.CylinderGeometry(0.023, 0.023, 0.05, 14);
  const p1 = new THREE.Mesh(postGeo, postMat); p1.position.set(-SW_GAP, 0.02, 0);
  const p2 = new THREE.Mesh(postGeo, postMat); p2.position.set(SW_GAP, 0.02, 0);
  g.add(p1, p2);

  const lever = new THREE.Group();
  const armMat = new THREE.MeshStandardMaterial({ color: 0xff5252, metalness: 0.55, roughness: 0.4 });
  const arm = new THREE.Mesh(new THREE.BoxGeometry(SW_GAP * 2, 0.03, 0.03), armMat);
  arm.position.x = SW_GAP; lever.add(arm);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 16), armMat);
  knob.position.x = SW_GAP * 2; lever.add(knob);
  lever.position.set(-SW_GAP, 0.038, 0);
  g.add(lever);

  const hit = new THREE.Mesh(
    new THREE.BoxGeometry(SW_GAP * 2 + 0.24, 0.24, 0.24),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
  );
  hit.position.set(0, 0.04, 0); g.add(hit);

  const lbl = makeLabel(labelText, '#ffd166');
  lbl.position.set(0, 0.16, 0); g.add(lbl);

  g.userData = { lever, swId };
  g.traverse((o) => { o.userData.swId = swId; });
  return g;
}

// ───────── RESISTOR (baru) ─────────
// Badan keramik + 4 gelang warna (mengikuti nilai) + kaki kabel di kedua ujung.
// Terminal ada di x = ±RES_HALF.
function createResistor(name, value) {
  const g = new THREE.Group();

  g.add(makeWire(-RES_HALF, 0, -0.047, 0, 0.009));
  g.add(makeWire(0.047, 0, RES_HALF, 0, 0.009));

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe0c9a0, roughness: 0.6, metalness: 0.05 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.074, 24), bodyMat);
  body.rotation.z = Math.PI / 2; g.add(body);

  const capGeo = new THREE.CylinderGeometry(0.032, 0.032, 0.014, 24);
  [-0.040, 0.040].forEach((x) => {
    const c = new THREE.Mesh(capGeo, bodyMat);
    c.rotation.z = Math.PI / 2; c.position.x = x; g.add(c);
  });

  const bandGeo = new THREE.CylinderGeometry(0.0285, 0.0285, 0.008, 24);
  const bandMats = [];
  [-0.026, -0.012, 0.002, 0.026].forEach((x) => {
    const m = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
    const b = new THREE.Mesh(bandGeo, m);
    b.rotation.z = Math.PI / 2; b.position.x = x; g.add(b);
    bandMats.push(m);
  });
  bandMats[3].color.set(0xd4af37); // toleransi 5% (emas)

  const lbl = makeResLabel();
  lbl.position.set(0, 0.105, 0); g.add(lbl);

  g.userData.update = (v) => {
    const [d1, d2, m] = colorBands(v);
    bandMats[0].color.set(DIGIT_COLORS[d1]);
    bandMats[1].color.set(DIGIT_COLORS[d2]);
    bandMats[2].color.set(m === -1 ? 0xd4af37 : DIGIT_COLORS[m]);
    lbl.userData.set(name, fmtR(v));
  };
  g.userData.update(value);
  return g;
}

// ───────── PATH ELEKTRON ─────────
function makeLoopPath(yBranch) {
  const pts = [
    [RAIL_R, Y_BOT], [RAIL_R, yBranch], [RAIL_L, yBranch], [RAIL_L, Y_BOT],
    [BAT_X0, Y_BOT], [BAT_X1, Y_BOT], [MAIN_SW_X, Y_BOT],
  ].map((p) => new THREE.Vector3(p[0], p[1], 0));
  const segs = []; let total = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length], len = a.distanceTo(b);
    segs.push({ a, b, len, start: total }); total += len;
  }
  return { segs, total };
}

const _tmpV = new THREE.Vector3();
function pointAt(path, s) {
  s = ((s % path.total) + path.total) % path.total;
  for (const seg of path.segs) {
    if (s <= seg.start + seg.len) return _tmpV.copy(seg.a).lerp(seg.b, (s - seg.start) / seg.len);
  }
  return _tmpV.copy(path.segs[path.segs.length - 1].b);
}

// ───────── BUILD RANGKAIAN ─────────
function buildCircuit(parent, baseScale = 1) {
  // Tata letak: celah lampu→saklar melebar sesuai jumlah resistor terbanyak
  const maxN = Math.max(0, ...BRANCH_DEF.map((d) => model.branches[d.id].length));
  const gapLen = Math.max(0.33, maxN * RES_PITCH + 0.06);
  const swXof = (d) => d.lampX + LAMP_GAP + gapLen + SW_GAP;
  RAIL_R = Math.max(...BRANCH_DEF.map(swXof)) + SW_GAP + 0.25;

  const outer = new THREE.Group();
  parent.add(outer);
  const root = new THREE.Group();
  outer.add(root);
  root.position.x = -(RAIL_L + RAIL_R) / 2;       // pusatkan rangkaian
  const boardW = RAIL_R - RAIL_L + 0.38;
  const fit = Math.min(1, 1.62 / boardW);          // kecilkan bila rangkaian melebar
  outer.scale.setScalar(baseScale * fit);

  const board = new THREE.Mesh(
    new THREE.BoxGeometry(boardW, 1.36, 0.05),
    new THREE.MeshStandardMaterial({ color: 0x0f3b30, roughness: 0.75, metalness: 0.15 })
  );
  board.position.set((RAIL_L + RAIL_R) / 2, 0.06, -0.07); root.add(board);

  // Rel kiri & kanan
  root.add(makeWire(RAIL_L, Y_BOT, RAIL_L, BRANCH_DEF[0].y));
  root.add(makeWire(RAIL_R, Y_BOT, RAIL_R, BRANCH_DEF[0].y));
  // Baterai → rel kiri, saklar utama → rel kanan
  root.add(makeWire(RAIL_L, Y_BOT, BAT_X0, Y_BOT));
  root.add(makeWire(BAT_X1, Y_BOT, MAIN_SW_X - SW_GAP, Y_BOT));
  root.add(makeWire(MAIN_SW_X + SW_GAP, Y_BOT, RAIL_R, Y_BOT));

  // Sambungan sudut & percabangan
  addJoint(root, RAIL_L, Y_BOT);
  addJoint(root, RAIL_R, Y_BOT);
  BRANCH_DEF.forEach((d) => { addJoint(root, RAIL_L, d.y); addJoint(root, RAIL_R, d.y); });

  // ── Baterai (silinder dengan terminal + dan −) ──
  const batCx = (BAT_X0 + BAT_X1) / 2;
  const steel = new THREE.MeshStandardMaterial({ color: 0xd5dbe0, metalness: 0.95, roughness: 0.25 });

  const capNeg = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.012, 24), steel);
  capNeg.rotation.z = Math.PI / 2; capNeg.position.set(BAT_X0 + 0.006, Y_BOT, 0); root.add(capNeg);

  const bodyX0 = BAT_X0 + 0.012, bodyX1 = BAT_X1 - 0.03;
  const batBody = new THREE.Mesh(
    new THREE.CylinderGeometry(0.075, 0.075, bodyX1 - bodyX0, 28),
    new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.7 })
  );
  batBody.rotation.z = Math.PI / 2; batBody.position.set((bodyX0 + bodyX1) / 2, Y_BOT, 0); root.add(batBody);

  const sleeve = new THREE.Mesh(
    new THREE.CylinderGeometry(0.0775, 0.0775, 0.19, 28),
    new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.45, metalness: 0.35 })
  );
  sleeve.rotation.z = Math.PI / 2; sleeve.position.set(batCx - 0.025, Y_BOT, 0); root.add(sleeve);

  const nubPos = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.03, 20), steel);
  nubPos.rotation.z = Math.PI / 2; nubPos.position.set(BAT_X1 - 0.015, Y_BOT, 0); root.add(nubPos);

  const lblPlus = makeLabel('+', '#ff8a80');
  lblPlus.scale.set(0.14, 0.09, 1); lblPlus.position.set(BAT_X1 - 0.03, Y_BOT + 0.16, 0); root.add(lblPlus);
  const lblMin = makeLabel('\u2212', '#8ecbff');
  lblMin.scale.set(0.14, 0.09, 1); lblMin.position.set(BAT_X0 + 0.03, Y_BOT + 0.16, 0); root.add(lblMin);
  const lblBat = makeLabel('BATERAI', '#c7d2fe');
  lblBat.position.set(batCx, Y_BOT - 0.17, 0); root.add(lblBat);

  const mainSwitch = createSwitch('SAKLAR UTAMA', 'main');
  mainSwitch.position.set(MAIN_SW_X, Y_BOT, 0); root.add(mainSwitch);

  const resistors = {};
  const branches = BRANCH_DEF.map((def) => {
    const vals = model.branches[def.id];
    const swX = swXof(def);
    const g = new THREE.Group();

    // Rel kiri → lampu
    g.add(makeWire(RAIL_L, def.y, def.lampX - LAMP_GAP, def.y));

    // Lampu → [resistor seri…] → saklar
    const gapStart = def.lampX + LAMP_GAP, gapEnd = swX - SW_GAP;
    const mid = (gapStart + gapEnd) / 2;
    let prev = gapStart;
    resistors[def.id] = vals.map((val, i) => {
      const rx = mid + (i - (vals.length - 1) / 2) * RES_PITCH;
      const r = createResistor('R' + (i + 1), val);
      r.position.set(rx, def.y, 0); g.add(r);
      g.add(makeWire(prev, def.y, rx - RES_HALF, def.y));
      addJoint(g, rx - RES_HALF, def.y);
      addJoint(g, rx + RES_HALF, def.y);
      prev = rx + RES_HALF;
      return r;
    });
    g.add(makeWire(prev, def.y, gapEnd, def.y));

    // Saklar → rel kanan
    g.add(makeWire(swX + SW_GAP, def.y, RAIL_R, def.y));

    const lamp = createLamp('LAMPU ' + def.id.charAt(1));
    lamp.position.set(def.lampX, def.y, 0); g.add(lamp);

    const sw = createSwitch('S' + def.id.charAt(1), def.id);
    sw.position.set(swX, def.y, 0); g.add(sw);

    const path = makeLoopPath(def.y);
    const count = Math.max(9, Math.round(path.total * 2.8));
    const electrons = [], eGroup = new THREE.Group();
    for (let i = 0; i < count; i++) {
      const e = new THREE.Mesh(electronGeo, electronMat);
      e.userData.phase = i / count;
      eGroup.add(e); electrons.push(e);
    }
    eGroup.visible = false; g.add(eGroup);
    root.add(g);

    return {
      id: def.id, lamp, switchObj: sw, lever: sw.userData.lever,
      path, electrons, electronGroup: eGroup,
      glow: 0, targetGlow: 0, speed: 0.3, offset: 0,
    };
  });

  const starGeo = new THREE.BufferGeometry();
  const starPos = new Float32Array(160 * 3);
  for (let i = 0; i < starPos.length; i++) starPos[i] = (Math.random() - 0.5) * 3.2;
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
    color: 0xffffff, size: 0.006, transparent: true, opacity: 0.5, sizeAttenuation: true, depthWrite: false,
  }));
  stars.position.set((RAIL_L + RAIL_R) / 2, 0.1, -0.4); root.add(stars);

  return {
    root: outer, branches, stars, mainSwitch, resistors,
    mainLever: mainSwitch.userData.lever,
    tappables: [mainSwitch, ...branches.map((b) => b.switchObj)],
  };
}

function disposeTree(root) {
  root.traverse((o) => {
    if (o.geometry && !o.isSprite && !o.geometry.userData.shared) o.geometry.dispose();
    const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    mats.forEach((m) => {
      if (m.userData && m.userData.shared) return;
      if (m.map && !(m.map.userData && m.map.userData.shared)) m.map.dispose();
      m.dispose();
    });
  });
}

// Bangun ulang rangkaian saat jumlah resistor berubah (status saklar & nyala lampu dipertahankan)
function rebuildCircuit() {
  if (!circuitCtx || !circuit) return;
  const old = circuit;
  old.root.parent && old.root.parent.remove(old.root);
  disposeTree(old.root);
  circuit = buildCircuit(circuitCtx.parent, circuitCtx.baseScale);
  circuit.mainLever.rotation.z = old.mainLever.rotation.z;
  circuit.branches.forEach((b) => {
    const o = old.branches.find((x) => x.id === b.id);
    if (o) { b.glow = o.glow; b.offset = o.offset; b.lever.rotation.z = o.lever.rotation.z; }
  });
  syncUI();
}

// ───────── ANIMASI ─────────
let electronClock = 0;

function updateCircuit(dt) {
  if (!circuit) return;
  electronClock += dt;
  const k = Math.min(1, dt * 14);

  circuit.mainLever.rotation.z += ((state.main ? 0 : 0.95) - circuit.mainLever.rotation.z) * k;

  circuit.branches.forEach((b, idx) => {
    const conducting = state.main && state[b.id];
    b.lever.rotation.z += ((state[b.id] ? 0 : 0.95) - b.lever.rotation.z) * k;

    b.glow += ((conducting ? b.targetGlow : 0) - b.glow) * Math.min(1, dt * 8);
    const ud = b.lamp.userData;
    const pulse = 1 + 0.035 * Math.sin(electronClock * 9 + idx * 1.7);

    ud.bulbMat.emissiveIntensity = b.glow * 1.6;
    ud.bulbMat.opacity = 0.28 + b.glow * 0.40;
    ud.filMat.emissiveIntensity = b.glow * 3.5;
    ud.filMat.color.copy(ud.filOff).lerp(ud.filOn, b.glow);
    ud.core.material.opacity = b.glow * 0.55;
    ud.halo.visible = b.glow > 0.01;
    ud.halo.material.opacity = b.glow * 0.95;
    ud.halo.scale.set(0.45 * pulse * (0.8 + 0.2 * b.glow), 0.45 * pulse * (0.8 + 0.2 * b.glow), 1);
    ud.light.intensity = b.glow * 1.1 * pulse;

    b.electronGroup.visible = conducting;
    if (conducting) {
      b.offset += dt * b.speed;
      b.electrons.forEach((e) => {
        const s = (b.offset + e.userData.phase * b.path.total) % b.path.total;
        e.position.copy(pointAt(b.path, s));
      });
    }
  });

  if (circuit.stars) circuit.stars.rotation.z += dt * 0.02;
}

// ───────── HITUNG LISTRIK ─────────
function calc(id) {
  const rs = model.branches[id].reduce((a, b) => a + b, 0);
  const on = state.main && state[id];
  const rt = model.Rlamp + rs;
  const I = on ? model.V / rt : 0;
  return { rs, on, rt, I, vLamp: I * model.Rlamp, vRes: I * rs };
}

// ───────── UI ─────────
function syncUI() {
  let total = 0, n = 0;
  BRANCH_DEF.forEach((d) => {
    const c = calc(d.id);
    total += c.I; if (c.on) n++;

    const b = circuit && circuit.branches.find((x) => x.id === d.id);
    if (b) {
      b.targetGlow = c.on ? Math.min(1, Math.pow(c.vLamp / LAMP_RATED_V, 1.2)) : 0;
      b.speed = 0.2 + 0.9 * Math.min(2, c.vLamp / LAMP_RATED_V);
    }

    const s = $('sum-' + d.id);
    if (s) {
      let t = 'Rs = ' + fmtR(c.rs) + ' · R total cabang = ' + fmtR(c.rt);
      if (c.on) {
        t += '\nI = ' + fmtI(c.I) + ' · V lampu = ' + c.vLamp.toFixed(2) + ' V · V resistor = ' + c.vRes.toFixed(2) + ' V';
        if (c.vLamp > LAMP_RATED_V * 1.15) t += '\n⚠ Tegangan lampu melebihi ' + LAMP_RATED_V + ' V (terlalu terang)';
      } else {
        t += '\n' + (state.main ? 'Saklar S' + d.id.charAt(1) + ' terbuka — tidak ada arus' : 'Saklar utama terbuka — tidak ada arus');
      }
      s.textContent = t;
    }
  });

  if (!state.main) infoEl.textContent = 'Saklar utama terbuka — ketuk SAKLAR UTAMA untuk menutup rangkaian.';
  else if (n === 0) infoEl.textContent = 'Semua saklar cabang terbuka — tidak ada arus.';
  else {
    infoEl.textContent = 'V sumber = ' + trim(model.V, 2) + ' V (sama di tiap cabang) · I total = ' + fmtI(total) +
      (n > 1 ? ' = I₁ + I₂' : ' = I₁') + ' · R ekuivalen = ' + fmtR(model.V / total);
  }

  $('btnMain').classList.toggle('on', state.main);
  $('btnS1').classList.toggle('on', state.s1);
  $('btnS2').classList.toggle('on', state.s2);
}
function toggle(id) { state[id] = !state[id]; syncUI(); }

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Panel resistor per cabang: tambah, hapus, ubah nilai
function renderBranches() {
  const wrap = $('branches');
  wrap.innerHTML = '';
  BRANCH_DEF.forEach((d) => {
    const id = d.id, vals = model.branches[id];
    const card = el('div', 'card');

    const head = el('div', 'chead');
    head.appendChild(el('span', '', 'Cabang ' + id.charAt(1) + ' · seri dengan LAMPU ' + id.charAt(1)));
    const add = el('button', 'add', '+ Resistor');
    add.disabled = vals.length >= RES_MAX;
    add.addEventListener('click', () => {
      if (vals.length >= RES_MAX) return;
      vals.push(vals.length ? vals[vals.length - 1] : 10);
      renderBranches(); rebuildCircuit();
    });
    head.appendChild(add);
    card.appendChild(head);

    if (!vals.length) card.appendChild(el('div', 'csum', 'Belum ada resistor di cabang ini.'));

    vals.forEach((v, i) => {
      const row = el('div', 'rrow');
      row.appendChild(el('span', 'nm', 'R' + (i + 1)));

      const inp = document.createElement('input');
      inp.type = 'number'; inp.inputMode = 'decimal'; inp.step = 'any';
      inp.min = RMIN; inp.max = RMAX; inp.value = v;
      inp.setAttribute('list', 'rvals');
      const apply = (x) => {
        vals[i] = x;
        const r = circuit && circuit.resistors[id] && circuit.resistors[id][i];
        if (r) r.userData.update(x);
        syncUI();
      };
      inp.addEventListener('input', () => {
        const x = parseFloat(inp.value);
        if (isFinite(x) && x >= RMIN && x <= RMAX) apply(x);
      });
      inp.addEventListener('change', () => {
        let x = parseFloat(inp.value);
        if (!isFinite(x)) x = vals[i];
        x = Math.min(RMAX, Math.max(RMIN, x));
        inp.value = x; apply(x);
      });
      row.appendChild(inp);
      row.appendChild(el('span', 'unit', 'Ω'));

      const del = el('button', 'del', '✕');
      del.title = 'Hapus resistor';
      del.addEventListener('click', () => {
        vals.splice(i, 1);
        renderBranches(); rebuildCircuit();
      });
      row.appendChild(del);
      card.appendChild(row);
    });

    const sum = el('div', 'csum'); sum.id = 'sum-' + id;
    card.appendChild(sum);
    wrap.appendChild(card);
  });
  syncUI();
}

// Input tegangan baterai & hambatan lampu
function bindNum(input, key, min, max) {
  input.value = model[key];
  input.addEventListener('input', () => {
    const x = parseFloat(input.value);
    if (isFinite(x) && x >= min && x <= max) { model[key] = x; syncUI(); }
  });
  input.addEventListener('change', () => {
    let x = parseFloat(input.value);
    if (!isFinite(x)) x = model[key];
    x = Math.min(max, Math.max(min, x));
    input.value = x; model[key] = x; syncUI();
  });
}
bindNum($('vIn'), 'V', 1, 24);
bindNum($('rlIn'), 'Rlamp', 1, 10000);

$('btnMain').addEventListener('click', () => toggle('main'));
$('btnS1').addEventListener('click', () => toggle('s1'));
$('btnS2').addEventListener('click', () => toggle('s2'));
$('panelToggle').addEventListener('click', () => {
  const c = $('ctrl');
  const hidden = c.style.display === 'none';
  c.style.display = hidden ? 'block' : 'none';
  $('panelToggle').textContent = (hidden ? '▾' : '▸') + ' Atur rangkaian';
});

// Tap saklar 3D
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
function onPointerDown(e) {
  if (!circuit) return;
  if (e.target.closest && e.target.closest('#panel, #hud, #overlay')) return;

  let renderer, camera;
  if (currentMode === 'ar') { renderer = arRenderer; camera = arCamera; }
  else if (currentMode === '3d' && mode3D) { renderer = mode3D.renderer; camera = mode3D.camera; }
  if (!renderer || !camera) return;

  const rect = renderer.domElement.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if (x < 0 || y < 0 || x > rect.width || y > rect.height) return;

  pointer.set((x / rect.width) * 2 - 1, -(y / rect.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(circuit.tappables, true);
  if (hits.length) {
    const id = hits[0].object.userData.swId;
    if (id) toggle(id);
  }
}

    // supaya ukuran renderer & proyeksi kamera dihitung benar.
    container.innerHTML = '';
    container.className = 'mode-ar';
    container.style.display = 'block';

    mindarThree = new MindARThree({ container, imageTargetSrc: IMAGE_TARGET_SRC });
    arRenderer = mindarThree.renderer;
    arScene = mindarThree.scene;
    arCamera = mindarThree.camera;

    addLights(arScene);

    const anchor = mindarThree.addAnchor(0);
    circuitCtx = { parent: anchor.group, baseScale: AR_SCALE };
    circuit = buildCircuit(circuitCtx.parent, circuitCtx.baseScale);

    anchor.onTargetFound = () => { hudText.textContent = 'Target terdeteksi ✓ — ketuk saklar untuk menyalakan'; };
    anchor.onTargetLost = () => { hudText.textContent = 'Arahkan kamera ke gambar target…'; };

    await mindarThree.start();
    currentMode = 'ar';

    overlay.style.display = 'none';
    hud.style.display = 'flex';
    panel.style.display = 'flex';
    modeBadge.textContent = 'AR';
    modeBadge.classList.remove('mode-3d');
    hudText.textContent = 'Arahkan kamera ke gambar target…';
    renderBranches();

    window.addEventListener('pointerdown', onPointerDown);

    clock.start();
    arRenderer.setAnimationLoop(() => {
      updateCircuit(Math.min(clock.getDelta(), 0.05));
      arRenderer.render(arScene, arCamera);
    });
    statusMsg.textContent = '';
  } catch (err) {
    console.error('[AR] Gagal:', err);
    try {
      if (mindarThree && mindarThree.renderer) mindarThree.renderer.setAnimationLoop(null);
      if (mindarThree && mindarThree.stop) await mindarThree.stop();
    } catch (_) {}
    mindarThree = null; arRenderer = null; arScene = null; arCamera = null; circuit = null; circuitCtx = null;
    container.style.display = 'none';
    container.innerHTML = '';
    start3DMode('AR tidak dapat dimulai (kamera/target bermasalah). Mode 3D aktif.');
  }
}

// ───────── MODE 3D ─────────
function start3DMode(note = '') {
  container.innerHTML = '';
  container.className = 'mode-3d';
  container.style.display = 'block';

  const w = window.innerWidth, h = window.innerHeight;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  if ('outputColorSpace' in renderer && THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0f14);
  const grid = new THREE.GridHelper(4, 40, 0x1f3b34, 0x142822);
  grid.position.y = -0.75; scene.add(grid);

  const camera = new THREE.PerspectiveCamera(48, w / h, 0.1, 100);
  camera.position.set(0.05, 0.55, 1.85);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.03, 0);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 0.8; controls.maxDistance = 4;
  controls.panSpeed = 0.6;

  addLights(scene);
  circuitCtx = { parent: scene, baseScale: 1 };
  circuit = buildCircuit(circuitCtx.parent, circuitCtx.baseScale);

  const mode = { renderer, scene, camera, controls, animId: 0, onResize: null };
  const c3 = new THREE.Clock();
  (function loop() {
    mode.animId = requestAnimationFrame(loop);
    updateCircuit(Math.min(c3.getDelta(), 0.05));
    controls.update();
    renderer.render(scene, camera);
  })();

  mode.onResize = () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  };
  window.addEventListener('resize', mode.onResize);
  mode3D = mode;
  currentMode = '3d';

  overlay.style.display = 'none';
  hud.style.display = 'flex';
  panel.style.display = 'flex';
  modeBadge.textContent = '3D';
  modeBadge.classList.add('mode-3d');
  hudText.textContent = 'Geser = putar · Cubit/scroll = zoom · Ketuk saklar = nyala/mati';
  renderBranches();

  window.addEventListener('pointerdown', onPointerDown);
  statusMsg.classList.remove('error');
  statusMsg.textContent = note || '';
  startBtn.disabled = false; demoBtn.disabled = false;
}

// ───────── STOP ─────────
async function stopAR() {
  window.removeEventListener('pointerdown', onPointerDown);

  if (currentMode === 'ar' && mindarThree) {
    try {
      if (mindarThree.renderer) mindarThree.renderer.setAnimationLoop(null);
      if (mindarThree.stop) await mindarThree.stop();
    } catch (_) {}
    mindarThree = null; arRenderer = null; arScene = null; arCamera = null;
  } else if (currentMode === '3d' && mode3D) {
    cancelAnimationFrame(mode3D.animId);
    window.removeEventListener('resize', mode3D.onResize);
    try { mode3D.controls.dispose(); } catch (_) {}
    try { mode3D.renderer.dispose(); } catch (_) {}
    mode3D = null;
  }

  container.innerHTML = '';
  container.style.display = 'none';
  hud.style.display = 'none';
  panel.style.display = 'none';
  overlay.style.display = 'flex';
  statusMsg.textContent = '';
  statusMsg.classList.remove('error');

  state.main = state.s1 = state.s2 = false;
  circuit = null; circuitCtx = null; currentMode = null;
  startBtn.disabled = false; demoBtn.disabled = false;
}

startBtn.addEventListener('click', startAR);
demoBtn.addEventListener('click', () => start3DMode('Mode 3D — tanpa kamera.'));
stopBtn.addEventListener('click', stopAR);
</script>
</body>
